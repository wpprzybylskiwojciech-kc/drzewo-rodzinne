<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Drzewo rodzinne – stożek rogówki</title>
<style>
:root{
  --navy:#1f3556;
  --navy-soft:#e9eef5;
  --ink:#1d1d1f;
  --mute:#6e6e73;
  --line:#d8dce3;
  --bg:#ffffff;
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,textarea:focus-visible{outline:3px solid rgba(31,53,86,.35);outline-offset:2px}
.person:focus-visible{outline:none}
#app{height:100%;height:100dvh;display:flex;flex-direction:column}
header{display:flex;justify-content:flex-end;align-items:center;gap:6px;padding:10px 14px;min-height:48px}
.link{background:none;border:0;color:var(--navy);font-size:15px;padding:8px 10px;border-radius:10px}
.link:hover{background:var(--navy-soft)}
.link[disabled]{color:#b5bac3;cursor:default;background:none}
.hidden{display:none!important}

/* intro */
#intro{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px 24px 64px}
#intro .logo{height:128px;width:auto;margin:0 0 28px}
.brand{height:44px;width:auto;margin-right:auto}
#intro h1{font-size:clamp(28px,6vw,44px);line-height:1.1;font-weight:650;letter-spacing:-.02em;margin:0 0 12px;max-width:16em}
#intro p{color:var(--mute);font-size:17px;margin:0 0 32px;max-width:26em;line-height:1.45}
.choices{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;max-width:520px}
.big{background:var(--navy);color:#fff;border:0;border-radius:999px;padding:16px 30px;font-size:19px;font-weight:550;min-width:150px}
.big:hover{filter:brightness(1.12)}
.big.ghost{background:var(--navy-soft);color:var(--navy)}
.big.ghost:hover{filter:brightness(.97)}
.privacy{margin-top:40px;font-size:13px;color:var(--mute)}

/* chart */
#chartWrap{flex:1;overflow:auto;position:relative;-webkit-overflow-scrolling:touch}
#chartInner{min-width:100%;display:flex;justify-content:center}
svg text{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.person{cursor:pointer}
.person:focus{outline:none}

/* sheet */
#sheet{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.96);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border-top:1px solid var(--line);border-radius:22px 22px 0 0;padding:16px 18px calc(18px + env(safe-area-inset-bottom));
  box-shadow:0 -8px 30px rgba(31,53,86,.08);max-height:70vh;overflow:auto}
.sheetIn{max-width:640px;margin:0 auto}
.sheetTop{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.sheetTitle{font-size:20px;font-weight:650;letter-spacing:-.01em}
.x{background:var(--navy-soft);border:0;color:var(--navy);width:32px;height:32px;border-radius:50%;font-size:18px;line-height:1}
.lbl{font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--mute);margin:12px 0 6px}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.seg button,.chip{border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:10px 6px;font-size:14px;color:var(--ink)}
.seg button[aria-pressed="true"],.chip[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:#fff}
.row{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:10px 16px;font-size:15px}
.act{background:var(--navy-soft);color:var(--navy);border:0;border-radius:12px;padding:12px 16px;font-size:15px;font-weight:550}
.act:hover{filter:brightness(.97)}
.act.solid{background:var(--navy);color:#fff}
.note{font-size:13px;color:var(--mute);margin:8px 0 0}
@media(max-width:480px){.seg{grid-template-columns:repeat(2,1fr)}}

/* modal */
#modal{position:fixed;inset:0;background:rgba(20,30,50,.35);display:flex;align-items:center;justify-content:center;padding:20px;z-index:10}
.card{background:#fff;border-radius:22px;padding:22px;max-width:460px;width:100%;max-height:90vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.2)}
.card h2{margin:0 0 4px;font-size:22px;letter-spacing:-.01em}
.card p{color:var(--mute);font-size:14px;margin:0 0 14px;line-height:1.45}
.stack{display:flex;flex-direction:column;gap:8px}
textarea{width:100%;min-height:88px;border:1.5px solid var(--line);border-radius:12px;padding:10px;font:12px/1.4 ui-monospace,Menlo,Consolas,monospace;resize:vertical;color:var(--ink)}
.msg{font-size:13px;color:var(--navy);min-height:18px;margin-top:8px}
.msg.err{color:#a1262b}
</style>
</head>
<body>
<div id="app">
  <header>
    <img id="hdrLogo" class="brand hidden" alt="Keratoconus Patients Foundation">
    <button class="link" id="btnUndo" disabled></button>
    <button class="link hidden" id="btnSave"></button>
    <button class="link" id="btnLang" aria-label="Language">English</button>
  </header>
  <section id="intro"></section>
  <section id="chartWrap" class="hidden"><div id="chartInner"></div></section>
  <div id="sheet" class="hidden"></div>
  <div id="modal" class="hidden"></div>
</div>

  const n=(navigator.language||'pl').toLowerCase();

/* ---------- tiny DOM helper ---------- */
function h(tag,attrs,kids){
  const e=document.createElement(tag);
  if(attrs) for(const k in attrs){
    if(k==='text') e.textContent=attrs[k];
    else if(k==='on') for(const ev in attrs.on) e.addEventListener(ev,attrs.on[ev]);
    else if(k==='class') e.className=attrs[k];
    else e.setAttribute(k,attrs[k]);
  }
  (kids||[]).forEach(function(c){ if(c) e.appendChild(c); });
  return e;
}
const SVGNS='http://www.w3.org/2000/svg';
function s(tag,attrs,kids){
  const e=document.createElementNS(SVGNS,tag);
  if(attrs) for(const k in attrs){
    if(k==='text') e.textContent=attrs[k];
    else if(k==='on') for(const ev in attrs.on) e.addEventListener(ev,attrs.on[ev]);
    else e.setAttribute(k,attrs[k]);
  }
  (kids||[]).forEach(function(c){ if(c) e.appendChild(c); });
  return e;
}

/* ---------- model ---------- */
function newState(sex,st){
  return {persons:{p1:{id:'p1',sex:sex,st:st,dead:false,pc:null}},couples:{},proband:'p1',next:2};
}
function nid(prefix){const id=prefix+S.next; S.next++; return id;}
function newPerson(sex,pc){const id=nid('p'); S.persons[id]={id:id,sex:sex,st:'unknown',dead:false,pc:pc||null}; return id;}
function couplesOf(id){
  return Object.keys(S.couples).map(function(k){return S.couples[k];})
    .filter(function(c){return c.a===id||c.b===id;});
}
function other(c,p){return c.a===p?c.b:c.a;}

function snapshot(){history.push(JSON.stringify(S)); if(history.length>80) history.shift(); }
function persist(){ try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){} }

function addParents(pid){
  const P=S.persons[pid]; if(P.pc) return P.pc;
  const cid=nid('c');
  const f=newPerson('m'), m=newPerson('f');
  S.couples[cid]={id:cid,a:f,b:m,kids:[pid]};
  P.pc=cid; return cid;
}
function addSibling(pid,sex){
  const P=S.persons[pid];
  const cid=P.pc||addParents(pid);
  const C=S.couples[cid];
  const id=newPerson(sex,cid);
  C.kids.splice(C.kids.indexOf(pid)+1,0,id);
  return id;
}
function addChild(pid,sex,withId){
  let C;
  if(withId && withId!=='new' && S.couples[withId]) C=S.couples[withId];
  else{
    const P=S.persons[pid];
    const partner=newPerson(P.sex==='m'?'f':'m');
    const cid=nid('c');
    C=S.couples[cid]={id:cid,a:pid,b:partner,kids:[]};
  }
  const id=newPerson(sex,C.id);
  C.kids.push(id);
  return id;
}

/* ---------- generations & relations ---------- */
function computeGen(){
  const g={}; g[S.proband]=0; const q=[S.proband];
  while(q.length){
    const id=q.shift(), p=S.persons[id], gg=g[id];
    if(p.pc){
      const c=S.couples[p.pc];
      [c.a,c.b].forEach(function(m){ if(!(m in g)){g[m]=gg-1;q.push(m);} });
      c.kids.forEach(function(k){ if(!(k in g)){g[k]=gg;q.push(k);} });
    }
    couplesOf(id).forEach(function(c){
      const o=other(c,id); if(!(o in g)){g[o]=gg;q.push(o);}
      c.kids.forEach(function(k){ if(!(k in g)){g[k]=gg+1;q.push(k);} });
    });
  }
  return g;
}
function ancestorsOf(id){
  const m={};
  (function up(x,d){
    if(x in m) return; m[x]=d;
    const p=S.persons[x];
    if(p.pc){const c=S.couples[p.pc]; up(c.a,d+1); up(c.b,d+1);}
  })(id,0);
  return m;
}
function bloodRel(id){
  const A=ancestorsOf(S.proband), B=ancestorsOf(id);
  let best=null;
  for(const a in B){ if(a in A){ const k=A[a], j=B[a]; if(!best||k+j<best[0]+best[1]) best=[k,j]; } }
  return best;
}
function relLabel(id){
  const P=S.persons[id], i=P.sex==='m'?0:1, R=TXT[lang].rel;
  const best=bloodRel(id);
  if(best){ const e=R[best[0]+','+best[1]]; if(e) return e[i]; }
  const mine=couplesOf(S.proband).some(function(c){return other(c,S.proband)===id;});
  if(mine) return R.partner[i];
  return '';
}

/* ---------- layout ---------- */
const GAP=84, PD=100, ROWH=150;
let vis;
function mkB(){return {n:{},e:{}};}
function addB(b,id,x){
  b.n[id]=x; const g=gen[id], e=b.e[g];
  if(!e) b.e[g]=[x,x]; else{ if(x<e[0]) e[0]=x; if(x>e[1]) e[1]=x; }
}
function mergeB(a,b,dx){ for(const id in b.n) addB(a,id,b.n[id]+dx); }
function lo(b,g,sg){const e=b.e[g]; return sg>0?e[0]:-e[1];}
function hi(b,g,sg){const e=b.e[g]; return sg>0?e[1]:-e[0];}
/* shift (in direction sg) so that b is entirely beyond a, given b already shifted by bdx */
function beyond(a,b,sg,gap,bdx){
  let m=-Infinity; const sh=(bdx||0)*sg;
  for(const g in b.e) if(a.e[g]) m=Math.max(m,hi(a,g,sg)+gap-(lo(b,g,sg)+sh));
  return m;
}

function unit(core,p,c,sg){
  const q=other(c,p);
  vis.p[q]=1;
  const qb=personFull(q,-sg);
  let d=Math.max(PD,beyond(core,qb,sg,GAP));
  let kb=null; const anc=[];
  c.kids.forEach(function(k){
    const b=personFull(k,0);
    if(!kb){kb=b;anc.push(0);} else{const m=beyond(kb,b,1,GAP); mergeB(kb,b,m); anc.push(m);}
  });
  let kdx=0;
  if(kb){
    const kc=(anc[0]+anc[anc.length-1])/2;
    for(let it=0;it<20;it++){
      kdx=sg*d/2-kc;
      const e1=beyond(core,kb,sg,GAP,kdx);
      const e2=beyond(kb,qb,sg,GAP,sg*d-kdx)  ;
      // e2 is computed for qb relative to kb already shifted: recompute precisely below
      const e2b=(function(){
        let m=-Infinity;
        for(const g in qb.e) if(kb.e[g]){
          // kb shifted by kdx, qb shifted by sg*d  (in direction sg)
          const khi=hi(kb,g,sg)+sg*kdx, qlo=lo(qb,g,sg)+sg*(sg*d);
          m=Math.max(m,khi+GAP-qlo);
        }
        return m;
      })();
      if(e1<=0.5&&e2b<=0.5) break;
      d+=2*Math.max(e1,0)+Math.max(e2b,0);
    }
  }
  mergeB(core,qb,sg*d);
  if(kb) mergeB(core,kb,kdx);
}

function personFull(p,avoid){
  vis.p[p]=1;
  const core=mkB(); addB(core,p,0);
  const cs=couplesOf(p).filter(function(c){return !vis.c[c.id];});
  cs.forEach(function(c,i){
    vis.c[c.id]=1;
    const sg=avoid?-avoid:(i%2?-1:1);
    unit(core,p,c,sg);
  });
  const P=S.persons[p];
  if(P.pc && !vis.c[P.pc]){
    const C=S.couples[P.pc]; vis.c[C.id]=1;
    const idx=C.kids.indexOf(p);
    let before=C.kids.slice(0,idx), after=C.kids.slice(idx+1);
    if(avoid===-1){after=before.concat(after);before=[];}
    else if(avoid===1){before=before.concat(after);after=[];}
    const anc={}; anc[p]=0;
    for(let i=before.length-1;i>=0;i--){
      const k=before[i], b=personFull(k,1), m=beyond(core,b,-1,GAP);
      mergeB(core,b,-m); anc[k]=-m;
    }
    after.forEach(function(k){
      const b=personFull(k,-1), m=beyond(core,b,1,GAP);
      mergeB(core,b,m); anc[k]=m;
    });
    // keep a parent who has other families on the side away from this person's partner
    let pa=C.a, pb=C.b;
    const extra=function(m){return couplesOf(m).filter(function(c){return !vis.c[c.id];}).length;};
    if((avoid===1&&extra(pb)>extra(pa))||(avoid===-1&&extra(pa)>extra(pb))){const tmp=pa;pa=pb;pb=tmp;}
    const b1=personFull(pa,1), b2=personFull(pb,-1);
    const dd=Math.max(PD,beyond(b1,b2,1,GAP));
    const vals=Object.keys(anc).map(function(k){return anc[k];});
    const target=(Math.min.apply(null,vals)+Math.max.apply(null,vals))/2;
    // father's side stays to the left of this sibling row, mother's side to the right
    let L1=Infinity, R2=-Infinity;
    for(const g in b1.e) if(core.e[g]) L1=Math.min(L1,core.e[g][0]-GAP-b1.e[g][1]);
    for(const g in b2.e) if(core.e[g]) R2=Math.max(R2,core.e[g][1]+GAP-b2.e[g][0]);
    const x1=Math.min(target-dd/2,L1), x2=Math.max(target+dd/2,R2);
    mergeB(core,b1,x1); mergeB(core,b2,x2);
  }
  return core;
}

function layout(){
  gen=computeGen();
  vis={p:{},c:{}};
  const b=personFull(S.proband,0);
  pos={}; for(const id in b.n) pos[id]=b.n[id];
  // safety net: no two people closer than 70px in one row
  const rows={};
  Object.keys(pos).forEach(function(id){(rows[gen[id]]=rows[gen[id]]||[]).push(id);});
  Object.keys(rows).forEach(function(g){
    const r=rows[g].sort(function(a,b2){return pos[a]-pos[b2];});
    for(let i=1;i<r.length;i++) if(pos[r[i]]-pos[r[i-1]]<70) pos[r[i]]=pos[r[i-1]]+70;
  });
}

/* ---------- drawing ---------- */
const NAVY='#1f3556', R=22;
function symbol(sex,st,dead,cx,cy,sel){
  const g=s('g');
  const fill=st==='affected'?NAVY:(st==='suspected'?'#d3dcea':'#ffffff');
  const dash=st==='suspected'?'5 3':null;
  const common={fill:fill,stroke:NAVY,'stroke-width':2.2};
  if(dash) common['stroke-dasharray']=dash;
  if(sel) g.appendChild(sex==='m'
    ? s('rect',{x:cx-R-8,y:cy-R-8,width:2*R+16,height:2*R+16,rx:6,fill:'none',stroke:NAVY,'stroke-opacity':.25,'stroke-width':5})
    : s('circle',{cx:cx,cy:cy,r:R+8,fill:'none',stroke:NAVY,'stroke-opacity':.25,'stroke-width':5}));
  g.appendChild(sex==='m'
    ? s('rect',Object.assign({x:cx-R,y:cy-R,width:2*R,height:2*R},common))
    : s('circle',Object.assign({cx:cx,cy:cy,r:R},common)));
  if(st==='unknown') g.appendChild(s('text',{x:cx,y:cy+7,'text-anchor':'middle','font-size':20,'font-weight':500,fill:NAVY,text:'?'}));
  if(dead) g.appendChild(s('line',{x1:cx-R-8,y1:cy+R+8,x2:cx+R+8,y2:cy-R-8,stroke:NAVY,'stroke-width':2.4,'stroke-linecap':'round'}));
  return g;
}

function wrapLabel(lab){
  if(lab.length<=12) return [lab];
  let i=lab.indexOf(' / ');
  if(i>0) return [lab.slice(0,i+2),lab.slice(i+3)];
  i=lab.indexOf('-');
  if(i>0) return [lab.slice(0,i+1),lab.slice(i+1)];
  i=lab.indexOf(' ');
  if(i>0) return [lab.slice(0,i),lab.slice(i+1)];
  return [lab];
}
function labelEl(cx,y,lab){
  const lines=wrapLabel(lab);
  const t=s('text',{x:cx,y:y,'text-anchor':'middle','font-size':12.5,fill:'#6e6e73'});
  lines.forEach(function(ln,i){ t.appendChild(s('tspan',{x:cx,dy:i?15:0,text:ln})); });
  return t;
}

function buildSvg(forExport){
  const ids=Object.keys(pos);
  let minX=Infinity,maxX=-Infinity,minG=Infinity,maxG=-Infinity;
  ids.forEach(function(id){
    minX=Math.min(minX,pos[id]); maxX=Math.max(maxX,pos[id]);
    minG=Math.min(minG,gen[id]); maxG=Math.max(maxG,gen[id]);
  });
  const PADX=56, PADT=56, legendH=5*26+30;
  const chartW=maxX-minX+2*PADX;
  const W=Math.max(chartW,300), H=PADT+(maxG-minG)*ROWH+R+84+legendH;
  const ox=(W-chartW)/2+PADX-minX;
  const X=function(id){return pos[id]+ox;};
  const Y=function(id){return PADT+(gen[id]-minG)*ROWH;};

  const svg=s('svg',{viewBox:'0 0 '+W+' '+H,width:W,height:H,role:'img','aria-label':t('title')});
  if(forExport) svg.appendChild(s('rect',{x:0,y:0,width:W,height:H,fill:'#fff'}));
  const lines=s('g',{stroke:NAVY,'stroke-width':2,fill:'none','stroke-linecap':'round','stroke-linejoin':'round'});
  svg.appendChild(lines);

  Object.keys(S.couples).forEach(function(cid){
    const c=S.couples[cid];
    if(!(c.a in pos)||!(c.b in pos)) return;
    const xa=X(c.a), xb=X(c.b), y=Y(c.a);
    const x1=Math.min(xa,xb)+R, x2=Math.max(xa,xb)-R;
    lines.appendChild(s('line',{x1:x1,y1:y,x2:x2,y2:y}));
    const kids=c.kids.filter(function(k){return k in pos;});
    if(kids.length){
      const mx=(xa+xb)/2, yb=y+ROWH/2+10;
      lines.appendChild(s('line',{x1:mx,y1:y,x2:mx,y2:yb}));
      const xs=kids.map(X).concat([mx]);
      const l=Math.min.apply(null,xs), r=Math.max.apply(null,xs);
      if(r>l) lines.appendChild(s('line',{x1:l,y1:yb,x2:r,y2:yb}));
      kids.forEach(function(k){
        lines.appendChild(s('line',{x1:X(k),y1:yb,x2:X(k),y2:Y(k)-R-(S.persons[k].st==='x'?0:0)}));
      });
    }
  });

  ids.forEach(function(id){
    const P=S.persons[id], cx=X(id), cy=Y(id);
    const g=s('g',{'class':'person','data-id':id,tabindex:forExport?null:0,role:forExport?null:'button'});
    g.appendChild(symbol(P.sex,P.st,P.dead,cx,cy,!forExport&&sel===id));
    const lab=relLabel(id);
    if(lab) g.appendChild(labelEl(cx,cy+R+26,lab));
    if(!forExport){
      g.appendChild(s('rect',{x:cx-R-12,y:cy-R-12,width:2*R+24,height:2*R+40,fill:'transparent'}));
      g.addEventListener('click',function(){ select(id); });
      g.addEventListener('keydown',function(ev){ if(ev.key==='Enter'||ev.key===' '){ev.preventDefault();select(id);} });
    }
    svg.appendChild(g);
  });

  // legend
  const ly=H-legendH+10, lx=PADX*0.6;
  const items=[['affected',false],['unaffected',false],['unknown',false],['suspected',false],['affected',true]];
  items.forEach(function(it,i){
    const yy=ly+i*26;
    const g=s('g',{transform:'translate('+(lx)+','+yy+') scale(.5)'});
    g.appendChild(symbol('f',it[0],it[1]&&false,R+4,R+4,false));
    if(it[1]){ // deceased item: plain white shape with slash
      g.innerHTML=''; g.appendChild(symbol('f','unaffected',true,R+4,R+4,false));
    }
    svg.appendChild(g);
    const label=it[1]?TXT[lang].lg.dead:TXT[lang].lg[it[0]];
    svg.appendChild(s('text',{x:lx+34,y:yy+17,'font-size':13,fill:'#4a4a50',text:label}));
  });
  return {svg:svg,W:W,H:H,X:X,Y:Y};
}

let lastBuild=null;
function renderChart(keepScroll){
  layout();
  const wrap=$('chartWrap'), inner=$('chartInner');
  const b=buildSvg(false); lastBuild=b;
  const avail=wrap.clientWidth||window.innerWidth;
  const scale=Math.max(.5,Math.min(1.15,avail/b.W));
  b.svg.setAttribute('width',Math.round(b.W*scale));
  b.svg.setAttribute('height',Math.round(b.H*scale));
  view={w:b.W,h:b.H,scale:scale};
  const sl=wrap.scrollLeft, st=wrap.scrollTop;
  inner.textContent=''; inner.appendChild(b.svg);
  inner.style.minHeight=(Math.round(b.H*scale))+'px';
  if(keepScroll){wrap.scrollLeft=sl;wrap.scrollTop=st;}
}
function scrollToPerson(id){
  if(!lastBuild||!(id in pos)) return;
  const wrap=$('chartWrap'), sc=view.scale;
  const x=lastBuild.X(id)*sc, y=lastBuild.Y(id)*sc;
  const svgLeft=Math.max(0,(wrap.clientWidth-view.w*sc)/2);
  (wrap.scrollTo||function(){}).call(wrap,{left:Math.max(0,svgLeft+x-wrap.clientWidth/2),top:Math.max(0,y-(wrap.clientHeight-($('sheet').offsetHeight||0))/2),behavior:'smooth'});
}

/* ---------- save / load ---------- */
function validState(o){
  try{
    if(!o||typeof o!=='object'||!o.persons||!o.couples||!o.proband) return null;
    const ids=Object.keys(o.persons); if(!ids.length||ids.length>500) return null;
    const out={persons:{},couples:{},proband:String(o.proband),next:Math.max(2,parseInt(o.next,10)||ids.length+2)};
    ids.forEach(function(id){
      const p=o.persons[id];
      if(!/^p\d+$/.test(id)) throw 0;
      out.persons[id]={id:id,sex:p.sex==='f'?'f':'m',st:STATUSES.indexOf(p.st)>=0?p.st:'unknown',dead:!!p.dead,pc:p.pc?String(p.pc):null};
    });
    Object.keys(o.couples).forEach(function(id){
      const c=o.couples[id];
      if(!/^c\d+$/.test(id)||!(c.a in out.persons)||!(c.b in out.persons)||!Array.isArray(c.kids)) throw 0;
      out.couples[id]={id:id,a:c.a,b:c.b,kids:c.kids.filter(function(k){return k in out.persons;})};
    });
    for(const id in out.persons){ const pc=out.persons[id].pc; if(pc&&!(pc in out.couples)) out.persons[id].pc=null; }
    if(!(out.proband in out.persons)) return null;
    return out;
  }catch(e){return null;}
}
function loadFromText(txt){
  let o; try{o=JSON.parse(txt);}catch(e){return false;}
  if(o&&o.pedigree) o=o.pedigree;
  const v=validState(o); if(!v) return false;
  snapshot=snapshot; // keep
  if(S) history.push(JSON.stringify(S));
  S=v; sel=S.proband; mode=null; persist(); renderAll(); return true;
}
function treeJson(){ return JSON.stringify({app:'kc-pedigree',version:1,pedigree:S},null,1); }
let DL=null;
try{ if(window.claude&&typeof window.claude.use==='function') window.claude.use('downloads').then(function(d){DL=d;},function(){}); }catch(e){}
function saveFile(name,mime,data,msg){
  if(DL){
    DL.save({filename:name,data:data}).then(function(){ if(msg){msg.className='msg';msg.textContent='';} },function(err){
      if(err&&err.code==='declined') return;
      if(msg){msg.className='msg err';msg.textContent=t('saveFail');}
    });
    return;
  }
  try{
    const blob=data instanceof Blob?data:new Blob([data],{type:mime});
    const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){URL.revokeObjectURL(a.href);},3000);
  }catch(e){ if(msg){msg.className='msg err';msg.textContent=t('saveFail');} }
}
function svgString(){
  const b=buildSvg(true);
  return {str:new XMLSerializer().serializeToString(b.svg),W:b.W,H:b.H};
}
function downloadPng(msg){
  const o=svgString();
  const img=new Image();
  img.onload=function(){
    try{
      const k=2, c=document.createElement('canvas'); c.width=o.W*k; c.height=o.H*k;
      const x=c.getContext('2d'); x.fillStyle='#fff'; x.fillRect(0,0,c.width,c.height);
      x.drawImage(img,0,0,c.width,c.height);
      c.toBlob(function(bl){ if(bl) saveFile('drzewo-rodzinne.png','image/png',bl,msg); else if(msg){msg.className='msg err';msg.textContent=t('saveFail');} },'image/png');
    }catch(e){ if(msg){msg.className='msg err';msg.textContent=t('saveFail');} }
  };
  img.onerror=function(){ if(msg){msg.className='msg err';msg.textContent=t('saveFail');} };
  img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(o.str);
}
